name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ─── 1. Checkout ──────────────────────────────────────────────────────────
    - name: Checkout code
      uses: actions/checkout@v4

    # ─── 2. Java ──────────────────────────────────────────────────────────────
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # ─── 3. Android SDK + NDK + CMake ─────────────────────────────────────────
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and CMake
      run: |
        sdkmanager --install \
          "ndk;25.1.8937393" \
          "cmake;3.22.1" \
          "platforms;android-35" \
          "build-tools;34.0.0"

    # ─── 4. Build libpd for Android (arm64-v8a) ───────────────────────────────
    - name: Clone libpd
      run: |
        git clone --recursive https://github.com/libpd/libpd.git /tmp/libpd
        echo "✅ libpd cloned"

    - name: Build libpd.so for arm64-v8a
      run: |
        NDK_PATH=$ANDROID_SDK_ROOT/ndk/25.1.8937393
        BUILD_DIR=/tmp/libpd-build

        mkdir -p $BUILD_DIR
        cd $BUILD_DIR

        cmake /tmp/libpd \
          -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-24 \
          -DANDROID_STL=c++_shared \
          -DCMAKE_BUILD_TYPE=Release \
          -DLIBPD_EXTRA=ON \
          -DLIBPD_MULTI=OFF \
          -DLIBPD_UTILS=ON

        cmake --build . --config Release -j4
        echo "✅ libpd built"
        ls -la $BUILD_DIR

    - name: Copy libpd artifacts into project
      run: |
        BUILD_DIR=/tmp/libpd-build
        PD_SRC=/tmp/libpd

        JNILIBS=android_skeleton/app/src/main/jniLibs/arm64-v8a
        HEADERS=android_skeleton/app/src/main/cpp/libpd/include

        mkdir -p $JNILIBS $HEADERS

        # Copiar .so (puede estar en build dir o en subdirectorio)
        find $BUILD_DIR -name "libpd.so" | head -1 | xargs -I{} cp {} $JNILIBS/libpd.so
        echo "libpd.so copiado:"
        ls -lh $JNILIBS/

        # Copiar headers públicos de libpd
        cp $PD_SRC/pure-data/src/m_pd.h     $HEADERS/
        cp $PD_SRC/libpd_wrapper/z_libpd.h  $HEADERS/libpd.h   2>/dev/null || \
        cp $PD_SRC/pure-data/src/x_libpd.h  $HEADERS/libpd.h   2>/dev/null || \
        find $PD_SRC -name "z_libpd.h" | head -1 | xargs -I{} cp {} $HEADERS/libpd.h
        cp $PD_SRC/pure-data/src/g_canvas.h $HEADERS/ 2>/dev/null || true

        echo "Headers copiados:"
        ls -lh $HEADERS/

    # ─── 5. Generar pd.h mínimo si no existe ──────────────────────────────────
    - name: Ensure pd.h exists
      run: |
        HEADERS=android_skeleton/app/src/main/cpp/libpd/include
        if [ ! -f "$HEADERS/pd.h" ]; then
          cat > $HEADERS/pd.h << 'EOF'
        #pragma once
        // pd.h — minimal shim for Visualonda build
        #include "libpd.h"
        EOF
          echo "pd.h creado"
        fi

    # ─── 6. Verificar estructura antes de compilar ────────────────────────────
    - name: Verify project structure
      run: |
        echo "=== jniLibs ==="
        find android_skeleton/app/src/main/jniLibs -type f | sort
        echo "=== cpp headers ==="
        find android_skeleton/app/src/main/cpp/libpd -type f | sort
        echo "=== cpp sources ==="
        find android_skeleton/app/src/main/cpp -name "*.cpp" -o -name "*.h" | sort

    # ─── 7. Compilar APK ──────────────────────────────────────────────────────
    - name: Build APK (Debug)
      run: |
        cd android_skeleton
        chmod +x gradlew
        ./gradlew assembleDebug \
          -Pandroid.ndkVersion=25.1.8937393 \
          --stacktrace \
          --info 2>&1 | tail -100

    # ─── 8. Upload APK ────────────────────────────────────────────────────────
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: visualonda-debug-apk
        path: android_skeleton/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    # ─── 9. Resumen ───────────────────────────────────────────────────────────
    - name: Build summary
      if: success()
      run: |
        APK=android_skeleton/app/build/outputs/apk/debug/app-debug.apk
        SIZE=$(du -h $APK | cut -f1)
        echo "## ✅ Build exitoso" >> $GITHUB_STEP_SUMMARY
        echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
        echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
        echo "| APK | app-debug.apk |" >> $GITHUB_STEP_SUMMARY
        echo "| Tamaño | $SIZE |" >> $GITHUB_STEP_SUMMARY
        echo "| Fecha | $(date) |" >> $GITHUB_STEP_SUMMARY
        echo "| NDK | 25.1.8937393 |" >> $GITHUB_STEP_SUMMARY
        echo "| LibPD | compilado desde source |" >> $GITHUB_STEP_SUMMARY
