name: Build Android APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NDK_VERSION: 25.1.8937393
  API_LEVEL: 24
  ABI: arm64-v8a

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    # ── 1. Checkout ────────────────────────────────────────────────────────────
    - name: Checkout code
      uses: actions/checkout@v4

    # ── 2. Java ────────────────────────────────────────────────────────────────
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # ── 3. Android SDK ─────────────────────────────────────────────────────────
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK and CMake
      run: |
        echo "y" | sdkmanager \
          "ndk;${NDK_VERSION}" \
          "cmake;3.22.1" \
          "platforms;android-35" \
          "build-tools;34.0.0" 2>/dev/null
        echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> $GITHUB_ENV

    # ── 4. Build libpd desde source ────────────────────────────────────────────
    - name: Clone libpd repository
      run: |
        git clone --depth 1 --recurse-submodules \
          https://github.com/libpd/libpd.git /tmp/libpd
        echo "libpd cloned — $(ls /tmp/libpd)"

    - name: Build libpd for arm64-v8a
      id: build_libpd
      run: |
        set -e
        NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}
        BUILD=/tmp/libpd-build
        mkdir -p $BUILD && cd $BUILD

        cmake /tmp/libpd \
          -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=${ABI} \
          -DANDROID_PLATFORM=android-${API_LEVEL} \
          -DANDROID_STL=c++_shared \
          -DCMAKE_BUILD_TYPE=MinSizeRel \
          -DLIBPD_EXTRA=ON \
          -DLIBPD_MULTI=OFF \
          -DLIBPD_UTILS=ON \
          -G Ninja

        cmake --build $BUILD --config MinSizeRel -j$(nproc)
        echo "BUILD_DIR=$BUILD" >> $GITHUB_ENV
        echo "libpd built OK"
        find $BUILD -name "*.so" | head -10

    # ── 5. Copiar libpd al proyecto ────────────────────────────────────────────
    - name: Copy libpd artifacts into project
      run: |
        PD_SRC=/tmp/libpd
        BUILD=$BUILD_DIR

        JNI_LIBS=android_skeleton/app/src/main/jniLibs/${ABI}
        HEADERS=android_skeleton/app/src/main/cpp/libpd/include
        mkdir -p $JNI_LIBS $HEADERS

        # ── libpd.so ────────────────────────────────────────────────────────
        SO=$(find $BUILD -name "libpd.so" 2>/dev/null | head -1)
        if [ -z "$SO" ]; then
          echo "ERROR: libpd.so no encontrado"
          find $BUILD -name "*.so"
          exit 1
        fi
        cp "$SO" $JNI_LIBS/libpd.so
        echo "libpd.so copiado ($(du -h $JNI_LIBS/libpd.so | cut -f1))"

        # ── libc++_shared.so (requerida en runtime) ─────────────────────────
        NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}
        CPPSHAR=$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so
        [ -f "$CPPSHAR" ] && cp "$CPPSHAR" $JNI_LIBS/ && echo "libc++_shared.so copiado"

        # ── Headers ────────────────────────────────────────────────────────
        # m_pd.h — siempre está en pure-data/src
        cp $PD_SRC/pure-data/src/m_pd.h $HEADERS/

        # libpd.h — puede llamarse z_libpd.h según la versión
        HDR=$(find $PD_SRC -name "z_libpd.h" 2>/dev/null | head -1)
        if [ -n "$HDR" ]; then
          cp "$HDR" $HEADERS/libpd.h
        else
          HDR=$(find $PD_SRC -name "libpd.h" 2>/dev/null | head -1)
          [ -n "$HDR" ] && cp "$HDR" $HEADERS/libpd.h
        fi

        # pd.h — shim si no existe
        if [ ! -f "$HEADERS/pd.h" ]; then
          printf '#pragma once\n#include "libpd.h"\n' > $HEADERS/pd.h
        fi

        echo "=== Headers copiados ==="
        ls -lh $HEADERS/
        echo "=== jniLibs ==="
        ls -lh $JNI_LIBS/

    # ── 6. Verificar estructura ────────────────────────────────────────────────
    - name: Verify project structure before build
      run: |
        echo "=== jniLibs ==="
        find android_skeleton/app/src/main/jniLibs -type f | sort
        echo ""
        echo "=== C++ headers ==="
        find android_skeleton/app/src/main/cpp/libpd -type f | sort
        echo ""
        echo "=== C++ sources ==="
        find android_skeleton/app/src/main/cpp -maxdepth 1 -name "*.cpp" -o -name "*.h" | sort
        echo ""
        echo "=== Assets ==="
        find android_skeleton/app/src/main/assets -type f | sort

    # ── 7. Cache de Gradle ────────────────────────────────────────────────────
    - name: Cache Gradle dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: gradle-${{ hashFiles('**/*.gradle', '**/gradle-wrapper.properties') }}
        restore-keys: gradle-

    # ── 8. Compilar APK ────────────────────────────────────────────────────────
    - name: Build APK (Debug)
      run: |
        cd android_skeleton
        chmod +x gradlew
        ./gradlew assembleDebug \
          -Pandroid.ndkVersion=${NDK_VERSION} \
          --no-daemon \
          --stacktrace 2>&1 | tail -150

    # ── 9. Upload APK ─────────────────────────────────────────────────────────
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: visualonda-debug
        path: android_skeleton/app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    # ── 10. Resumen ───────────────────────────────────────────────────────────
    - name: Build summary
      if: success()
      run: |
        APK=android_skeleton/app/build/outputs/apk/debug/app-debug.apk
        SIZE=$(du -h "$APK" | cut -f1)
        echo "## ✅ Build Exitoso" >> $GITHUB_STEP_SUMMARY
        echo "| | |" >> $GITHUB_STEP_SUMMARY
        echo "|---|---|" >> $GITHUB_STEP_SUMMARY
        echo "| APK | app-debug.apk ($SIZE) |" >> $GITHUB_STEP_SUMMARY
        echo "| NDK | ${NDK_VERSION} |" >> $GITHUB_STEP_SUMMARY
        echo "| ABI | ${ABI} |" >> $GITHUB_STEP_SUMMARY
        echo "| LibPD | compilado desde source |" >> $GITHUB_STEP_SUMMARY
        echo "| Fecha | $(date -u) |" >> $GITHUB_STEP_SUMMARY
